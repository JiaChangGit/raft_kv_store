[workspace]
resolver = "2"
members = ["crates/raft-protocol", "crates/raft-core", "crates/raft-sim", "crates/raft-storage", "crates/kv-state", "crates/raft-transport", "crates/raft-node"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raft-protocol = { path = "crates/raft-protocol" }
raft-core = { path = "crates/raft-core" }

[profile.test]
opt-level = 2
